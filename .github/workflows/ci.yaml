name: quality
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
  infrastructure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: helm lint deploy/helm/buildingpilot
      - run: helm template ci deploy/helm/buildingpilot > /tmp/buildingpilot.yaml
      - run: docker compose config --quiet
      - run: docker compose up -d kafka topics
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest -q -m kafka
        env:
          BP_TEST_KAFKA: "1"
      - if: always()
        run: docker compose down
